spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: transaction-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/transactions/**
        - id: statement-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/statements/**

server:
  port: 8080
